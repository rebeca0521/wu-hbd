<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>色色交友軟體...</title>
  <meta name="description" content="好色喔你......" />
  <style>
    /* ==========================================================================
       🎨 主要顏色與視覺變數設定 (修改這裡即可調整全站配色)
       ========================================================================== */
    :root {
      --brand-yellow: #FFC629;
      --brand-yellow-hover: #F2B611;
      --brand-yellow-deep: #E0A300;
      --brand-yellow-soft: #FFF7DC;
      --brand-yellow-pill: #FFF2C2;

      --brand-black: #1A1A1A;
      --text-primary: #1A1A1A;
      --text-secondary: #5C5C5C;
      --text-muted: #8E8E93;

      --bg-desktop: #EFECE6;
      --bg-app: #FAF8F4;
      --bg-card: #FFFFFF;
      --border-subtle: #EAE6DF;

      --like-color: #FFC629;
      --nope-color: #2B2B2B;

      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-pill: 999px;

      --shadow-card: 0 14px 34px rgba(26, 26, 26, 0.08), 0 3px 10px rgba(26, 26, 26, 0.04);
      --shadow-float: 0 10px 24px rgba(255, 198, 41, 0.28);
      --shadow-btn: 0 6px 18px rgba(26, 26, 26, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
      background-color: var(--bg-desktop);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    /* 手機 App 模擬器外框（桌機置中顯示，手機滿版） */
    .app-shell {
      position: relative;
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      height: 100dvh;
      background-color: var(--bg-app);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin: 0 auto;
    }

    @media (min-width: 480px) {
      body {
        padding: 16px 0;
        align-items: center;
      }
      .app-shell {
        min-height: min(860px, calc(100dvh - 32px));
        height: min(860px, calc(100dvh - 32px));
        border-radius: 38px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.14), 0 0 0 8px #FFFFFF;
      }
    }

    /* ==========================================================================
       頂部 Bumble 風格導覽列
       ========================================================================== */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 10px;
      background: var(--bg-app);
      z-index: 20;
      flex-shrink: 0;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
      color: var(--brand-black);
    }

    .brand-hive {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-hive img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .header-pill {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      background: var(--brand-yellow-pill);
      color: var(--brand-black);
      letter-spacing: 0.02em;
    }

    /* 進度條 */
    .progress-track {
      height: 4px;
      background: #E9E5DC;
      margin: 0 20px 8px;
      border-radius: 99px;
      overflow: hidden;
      flex-shrink: 0;
      transition: opacity 0.25s ease;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--brand-yellow);
      border-radius: 99px;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ==========================================================================
       各畫面容器 (View Switching)
       ========================================================================== */
    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      padding: 12px 18px 20px;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }

    .screen.active {
      display: flex;
      animation: screenFadeIn 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes screenFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==========================================================================
       通用按鈕樣式
       ========================================================================== */
    .btn-primary {
      appearance: none;
      border: none;
      background: var(--brand-yellow);
      color: var(--brand-black);
      font-size: 1.05rem;
      font-weight: 800;
      padding: 16px 28px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow-float);
      transition: transform 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease;
      user-select: none;
    }

    .btn-primary:hover {
      background: var(--brand-yellow-hover);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-secondary {
      appearance: none;
      border: 2px solid var(--border-subtle);
      background: #FFFFFF;
      color: var(--text-primary);
      font-size: 0.98rem;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
      user-select: none;
    }

    .btn-secondary:hover {
      border-color: var(--brand-black);
      background: #F9F8F6;
    }

    .btn-secondary:active {
      transform: scale(0.97);
    }

    /* ==========================================================================
       1. 首頁 (Welcome Screen)
       ========================================================================== */
    .welcome-card {
      margin: auto 0;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 36px 26px 30px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-subtle);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .welcome-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: var(--brand-yellow);
    }

    .welcome-badge-wrap {
      width: 84px;
      height: 84px;
      margin: 0 auto 20px;
      border-radius: 26px;
      background: var(--brand-yellow-soft);
      border: 2px solid var(--brand-yellow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      box-shadow: 0 8px 20px rgba(255, 198, 41, 0.22);
    }

    .welcome-tag {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--brand-yellow-pill);
      color: var(--brand-black);
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      margin-bottom: 12px;
    }

    .welcome-title {
      font-size: 1.9rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--brand-black);
      margin-bottom: 18px;
      line-height: 1.25;
      white-space: pre-line;
    }

    .welcome-lines {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 1.02rem;
      line-height: 1.65;
      color: var(--text-secondary);
      margin-bottom: 28px;
      font-weight: 500;
    }

    .welcome-lines strong {
      color: var(--brand-black);
      font-weight: 800;
      background: linear-gradient(transparent 60%, var(--brand-yellow-pill) 60%);
      padding: 0 4px;
    }

    .welcome-hint {
      margin-top: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ==========================================================================
       2. 禮物交友卡片區 (Swipe Screen)
       ========================================================================== */
    #screen-swipe {
      justify-content: space-between;
      padding-top: 4px;
      padding-bottom: 14px;
      overflow: hidden;
      min-height: 0;
    }

    .card-stage {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
      min-height: 0;
      margin-bottom: 14px;
      perspective: 1000px;
    }

    /* 下一張背景預覽卡，營造真實交友疊卡感 */
    .next-card-preview {
      position: absolute;
      inset: 0;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
      transform: scale(0.94) translateY(12px);
      opacity: 0.65;
      pointer-events: none;
      z-index: 1;
      transition: transform 0.2s ease, opacity 0.2s ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 主交友卡片 */
    .gift-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 5;
      display: flex;
      flex-direction: column;
      touch-action: pan-y;
      cursor: grab;
      user-select: none;
      will-change: transform;
      scrollbar-width: thin;
      scrollbar-color: rgba(26, 26, 26, 0.2) transparent;
    }

    .gift-card::-webkit-scrollbar {
      width: 5px;
    }

    .gift-card::-webkit-scrollbar-track {
      background: transparent;
    }

    .gift-card::-webkit-scrollbar-thumb {
      background: rgba(26, 26, 26, 0.2);
      border-radius: 99px;
    }

    .gift-card:active {
      cursor: grabbing;
    }

    .gift-card.animating {
      transition: transform 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.32s ease;
    }

    /* 照片區塊 (4:5 比例感) */
    .card-photo-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 4.3;
      background: #F4EFE6;
      overflow: hidden;
      flex-shrink: 0;
    }

    .card-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* 照片底部漸層與認證徽章 */
    .photo-bottom-bar {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .verified-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(26, 26, 26, 0.78);
      backdrop-filter: blur(6px);
      color: #FFFFFF;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
    }

    .verified-pill span {
      color: var(--brand-yellow);
    }

    .price-pill {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      color: var(--brand-black);
      font-size: 0.78rem;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* LIKE / NOPE 滑動印章 */
    .swipe-badge {
      position: absolute;
      top: 22px;
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      z-index: 12;
      transform: scale(0.9);
      transition: opacity 0.08s linear;
    }

    .swipe-badge.like {
      left: 20px;
      background: var(--brand-yellow);
      color: var(--brand-black);
      border: 3px solid var(--brand-black);
      transform: rotate(-12deg);
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }

    .swipe-badge.nope {
      right: 20px;
      background: var(--brand-black);
      color: #FFFFFF;
      border: 3px solid #FFFFFF;
      transform: rotate(12deg);
      box-shadow: 0 6px 16px rgba(0,0,0,0.2);
    }

    /* 卡片文字資訊區 */
    .card-body {
      padding: 18px 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg-card);
      flex: 1;
    }

    .profile-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .profile-name-age {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--brand-black);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .profile-job {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .profile-job::before {
      content: "💼";
      font-size: 0.88rem;
    }

    .profile-bio-box {
      background: var(--brand-yellow-soft);
      border-left: 4px solid var(--brand-yellow);
      padding: 11px 14px;
      border-radius: 4px 14px 14px 4px;
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--brand-black);
      line-height: 1.45;
    }

    .profile-desc {
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .profile-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: auto;
      padding-top: 4px;
    }

    .tag-chip {
      font-size: 0.8rem;
      font-weight: 700;
      background: #F3F1EC;
      color: var(--brand-black);
      padding: 5px 11px;
      border-radius: var(--radius-pill);
    }

    .tag-chip span {
      color: var(--brand-yellow-deep);
      margin-right: 2px;
    }

    .scroll-more-pill {
      display: none;
      align-items: center;
      gap: 4px;
      background: rgba(255, 198, 41, 0.95);
      color: var(--brand-black);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    /* 下方更多圖文介紹區 */
    .card-extra-section {
      margin-top: 8px;
      padding-top: 14px;
      border-top: 1.5px dashed var(--border-subtle);
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .card-extra-divider {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-extra-divider span {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--brand-black);
      background: var(--brand-yellow-pill);
      padding: 5px 14px;
      border-radius: var(--radius-pill);
      letter-spacing: 0.03em;
    }

    .card-extra-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-extra-item {
      background: #FAF8F4;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-extra-img {
      width: 100%;
      height: auto;
      display: block;
      background: #F4EFE6;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .card-extra-text {
      padding: 13px 15px;
      font-size: 0.92rem;
      color: var(--text-primary);
      line-height: 1.6;
      white-space: pre-line;
      font-weight: 600;
    }

    /* ==========================================================================
       底部操作按鈕列 (Undo / Skip / Like)
       ========================================================================== */
    .action-dock {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 4px 10px 2px;
      flex-shrink: 0;
      z-index: 15;
    }

    .dock-btn {
      appearance: none;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease, opacity 0.16s ease;
      user-select: none;
    }

    .dock-btn-circle {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      box-shadow: var(--shadow-btn);
      border: 1.5px solid var(--border-subtle);
      background: #FFFFFF;
      transition: transform 0.16s ease, background-color 0.16s ease, border-color 0.16s ease;
    }

    .dock-btn-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    /* Undo 按鈕 */
    .dock-btn.undo .dock-btn-circle {
      width: 50px;
      height: 50px;
      font-size: 1.2rem;
      color: var(--brand-black);
    }

    .dock-btn.undo:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    /* Skip 按鈕 */
    .dock-btn.skip .dock-btn-circle {
      width: 64px;
      height: 64px;
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--brand-black);
    }

    .dock-btn.skip:hover .dock-btn-circle {
      background: #F4F2EE;
      border-color: #D5D0C8;
    }

    /* Like 按鈕 */
    .dock-btn.like .dock-btn-circle {
      width: 68px;
      height: 68px;
      font-size: 1.7rem;
      background: var(--brand-yellow);
      border-color: var(--brand-yellow);
      box-shadow: var(--shadow-float);
    }

    .dock-btn.like:hover .dock-btn-circle {
      background: var(--brand-yellow-hover);
    }

    .dock-btn:not(:disabled):active .dock-btn-circle {
      transform: scale(0.9);
    }

    /* ==========================================================================
       Match 配對成功彈窗動畫 (1.4秒自動進入下一張)
       ========================================================================== */
    .match-overlay {
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 26, 0.86);
      backdrop-filter: blur(8px);
      z-index: 60;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
      text-align: center;
      color: #FFFFFF;
      cursor: pointer;
    }

    .match-overlay.active {
      display: flex;
      animation: matchPopIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes matchPopIn {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .match-card-inner {
      background: var(--brand-yellow);
      color: var(--brand-black);
      width: 100%;
      max-width: 340px;
      border-radius: var(--radius-xl);
      padding: 30px 22px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .match-avatar-wrap {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      margin: 0 auto 16px;
      border: 4px solid #FFFFFF;
      overflow: hidden;
      background: #FFF;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .match-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .match-title {
      font-size: 1.75rem;
      font-weight: 900;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }

    .match-subtitle {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.55;
      color: #2C2C2C;
    }

    .match-gift-highlight {
      display: inline-block;
      margin: 6px 0;
      font-size: 1.25rem;
      font-weight: 900;
      background: #FFFFFF;
      padding: 4px 14px;
      border-radius: var(--radius-pill);
    }

    /* ==========================================================================
       3. 瀏覽完成統計畫面 (Summary / Pre-Tournament Screen)
       ========================================================================== */
    .summary-card {
      margin: auto 0;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 32px 24px 28px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-subtle);
      text-align: center;
    }

    .summary-count-circle {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: var(--brand-yellow);
      color: var(--brand-black);
      font-size: 2.1rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      box-shadow: var(--shadow-float);
    }

    .summary-title {
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 14px;
      color: var(--brand-black);
    }

    .summary-lines {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 22px;
      font-weight: 600;
    }

    .liked-mini-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .liked-mini-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--brand-yellow-soft);
      border: 1px solid var(--brand-yellow);
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--brand-black);
    }

    /* ==========================================================================
       4. 最終淘汰賽畫面 (1v1 Tournament Screen)
       ========================================================================== */
    .tournament-header {
      text-align: center;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .tournament-badge {
      display: inline-block;
      background: var(--brand-black);
      color: var(--brand-yellow);
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      margin-bottom: 6px;
    }

    .tournament-prompt {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--brand-black);
    }

    .vs-arena {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
      justify-content: center;
    }

    .vs-fighter-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 2px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .vs-fighter-card:hover {
      border-color: var(--brand-yellow);
    }

    .vs-fighter-top {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .vs-thumb {
      width: 92px;
      height: 104px;
      border-radius: 14px;
      object-fit: cover;
      background: #F4EFE6;
      flex-shrink: 0;
    }

    .vs-info {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .vs-name {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--brand-black);
      margin-bottom: 3px;
    }

    .vs-job {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .vs-bio {
      font-size: 0.84rem;
      color: var(--brand-black);
      background: var(--brand-yellow-soft);
      padding: 6px 10px;
      border-radius: 10px;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .vs-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .vs-tag {
      font-size: 0.72rem;
      font-weight: 700;
      background: #F2EFE9;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      color: var(--text-secondary);
    }

    .vs-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: -2px 0;
    }

    .vs-divider::before,
    .vs-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }

    .vs-pill {
      background: var(--brand-black);
      color: var(--brand-yellow);
      font-weight: 900;
      font-size: 0.82rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    .vs-select-btn {
      appearance: none;
      border: none;
      background: var(--brand-yellow);
      color: var(--brand-black);
      font-size: 0.96rem;
      font-weight: 800;
      padding: 12px 16px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      width: 100%;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .vs-select-btn:hover {
      background: var(--brand-yellow-hover);
    }

    .vs-select-btn:active {
      transform: scale(0.98);
    }

    /* ==========================================================================
       5. 最終冠軍確認畫面 (Champion Confirmation Screen)
       ========================================================================== */
    .champion-card {
      margin: auto 0;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 26px 22px 24px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-subtle);
      text-align: center;
    }

    .trophy-icon {
      font-size: 2.6rem;
      margin-bottom: 6px;
    }

    .champion-subtitle {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .champion-name-banner {
      font-size: 1.65rem;
      font-weight: 900;
      color: var(--brand-black);
      margin-bottom: 14px;
    }

    .champion-preview {
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 2px solid var(--brand-yellow);
      background: var(--brand-yellow-soft);
      margin-bottom: 16px;
      text-align: left;
    }

    .champion-preview img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .champion-preview-info {
      padding: 12px 14px;
    }

    .champion-note {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }

    .champion-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ==========================================================================
       6. 生日祝福畫面 (Birthday Celebration Screen)
       ========================================================================== */
    .birthday-card {
      margin: auto 0;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 30px 22px 26px;
      box-shadow: var(--shadow-card);
      border: 2px solid var(--brand-yellow);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .birthday-cake {
      font-size: 3rem;
      margin-bottom: 8px;
      display: inline-block;
      animation: gentleBounce 2s infinite ease-in-out;
    }

    @keyframes gentleBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-6px) scale(1.06); }
    }

    .birthday-title {
      font-size: 1.85rem;
      font-weight: 900;
      color: var(--brand-black);
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      line-height: 1.25;
      white-space: pre-line;
    }

    .birthday-lines {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-secondary);
      line-height: 1.65;
      margin-bottom: 14px;
    }

    .birthday-heart {
      font-size: 1.6rem;
      margin-bottom: 16px;
    }

    .final-gift-showcase {
      background: var(--brand-yellow-soft);
      border: 2px solid var(--brand-yellow);
      border-radius: var(--radius-lg);
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      margin-bottom: 22px;
      animation: giftZoomIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes giftZoomIn {
      from {
        opacity: 0;
        transform: scale(0.86);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .final-gift-showcase img {
      width: 76px;
      height: 76px;
      border-radius: 14px;
      object-fit: cover;
      background: #FFF;
      flex-shrink: 0;
    }

    .final-gift-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--brand-yellow-deep);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }

    .final-gift-name {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--brand-black);
      margin-bottom: 2px;
    }

    .final-gift-desc {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.35;
    }

    /* 寄送配對紀念信區塊 */
    .email-notify-box {
      background: #FFFDF8;
      border: 1.5px dashed #E5C158;
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      text-align: left;
      margin-bottom: 18px;
    }

    .email-notify-title {
      font-size: 0.98rem;
      font-weight: 900;
      color: var(--brand-black);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .email-notify-desc {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .email-field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .email-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #E3DFD7;
      border-radius: 12px;
      font-size: 0.88rem;
      font-family: inherit;
      color: var(--brand-black);
      background: #FFFFFF;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .email-input:focus {
      border-color: var(--brand-yellow);
      box-shadow: 0 0 0 3px rgba(255, 198, 41, 0.22);
    }

    .email-btn-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-send-email {
      width: 100%;
      padding: 13px 16px;
      border-radius: var(--radius-pill);
      border: none;
      background: var(--brand-black);
      color: var(--brand-yellow);
      font-size: 0.92rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.16s ease, opacity 0.16s ease;
    }

    .btn-send-email:hover {
      transform: translateY(-1px);
    }

    .btn-send-email:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-preview-email {
      width: 100%;
      padding: 8px 12px;
      border-radius: var(--radius-pill);
      border: 1px solid #E3DFD7;
      background: #FFFFFF;
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-preview-email:hover {
      background: #F4F1EA;
    }

    .email-send-status {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      line-height: 1.5;
    }

    .email-send-status.success {
      display: block;
      background: #ECFDF3;
      border: 1px solid #A6F4C5;
      color: #027A48;
    }

    .email-send-status.info {
      display: block;
      background: #FFF9E6;
      border: 1px solid #F5D061;
      color: #7A5800;
    }

    .email-send-status.error {
      display: block;
      background: #FEF3F2;
      border: 1px solid #FECDCA;
      color: #B42318;
    }

    .email-fallback-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .email-fallback-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
      text-decoration: none;
      border: 1px solid var(--brand-black);
      background: var(--brand-yellow);
      color: var(--brand-black);
      cursor: pointer;
    }

    .email-letter-preview {
      display: none;
      margin-top: 12px;
      background: #FFFFFF;
      border: 1.5px solid #EAE5DC;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    }

    .email-letter-preview.open {
      display: block;
    }

    .email-letter-head {
      background: var(--brand-yellow);
      color: var(--brand-black);
      padding: 10px 14px;
      font-size: 0.78rem;
      font-weight: 800;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .email-letter-body {
      padding: 14px;
      font-size: 0.82rem;
      color: var(--brand-black);
      line-height: 1.65;
    }

    .email-cert-card {
      background: var(--brand-yellow-soft);
      border: 1.5px solid var(--brand-yellow);
      border-radius: 12px;
      padding: 12px;
      margin: 10px 0;
    }

    /* 慶祝紙屑 Canvas */
    #confetti-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>

    /* ==========================================================================
       圖片 Fallback 產生器 (當 images/gift-xxx.jpg 尚未放入或路徑錯誤時自動顯示精美插畫卡)
       ========================================================================== */
    function createFallbackSvgDataUri(gift) {
      const safeName = (gift && gift.name ? gift.name : "神秘禮物").replace(/[<>&"']/g, "");
      const safeJob = (gift && gift.profile && gift.profile.job ? gift.profile.job : "生日驚喜").replace(/[<>&"']/g, "");
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFF9E6"/>
            <stop offset="100%" stop-color="#FFE89E"/>
          </linearGradient>
        </defs>
        <rect width="800" height="900" fill="url(#bg)"/>
        <circle cx="400" cy="390" r="210" fill="#FFFDF5"/>
        <rect x="300" y="310" width="200" height="180" rx="24" fill="#FFC629" stroke="#1A1A1A" stroke-width="10"/>
        <rect x="280" y="270" width="240" height="52" rx="14" fill="#1A1A1A"/>
        <line x1="400" y1="270" x2="400" y2="490" stroke="#1A1A1A" stroke-width="14"/>
        <path d="M400 270 C355 215, 315 240, 355 270" fill="none" stroke="#FFC629" stroke-width="12" stroke-linecap="round"/>
        <path d="M400 270 C445 215, 485 240, 445 270" fill="none" stroke="#FFC629" stroke-width="12" stroke-linecap="round"/>
        <text x="400" y="680" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="900" fill="#1A1A1A">${safeName}</text>
        <text x="400" y="735" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#5C5C5C">${safeJob}</text>
      </svg>`;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    function setSafeImage(imgElement, gift) {
      if (!imgElement) return;
      const fallbackUri = createFallbackSvgDataUri(gift);
      imgElement.onerror = function () {
        imgElement.onerror = null;
        imgElement.src = fallbackUri;
      };
      imgElement.alt = gift && gift.name ? gift.name : "生日候選禮物";
      imgElement.src = gift && gift.image ? gift.image : fallbackUri;
    }

    /* ==========================================================================
       5. Initialization

    function initApp() {
      dom.headerBrandText.textContent = texts.appBrand;
      dom.welcomeBadgeText.textContent = texts.welcomeBadge;
      dom.welcomeTitle.innerHTML = String(texts.welcomeTitle || "")

      dom.labelBtnLike.textContent = texts.likeButtonLabel;

      dom.matchTitle.textContent = texts.matchTitle;
      dom.matchLine1.textContent = texts.matchPreLine;
      dom.matchLine2.textContent = texts.matchPostLine;

      });
      dom.btnUndo.addEventListener("click", (e) => {

      });

      dom.matchOverlay.addEventListener("click", dismissMatchOverlayEarly);

      dom.btnEnterTournament.addEventListener("click", startTournamentPhase);
      dom.btnPickA.addEventListener("click", () => handleTournamentPick("A"));
      dom.btnPickB.addEventListener("click", () => handleTournamentPick("B"));
      dom.btnConfirmYes.addEventListener("click", showBirthdayCelebration);
      dom.btnConfirmRethink.addEventListener("click", handleConfirmRethink);
      dom.btnRestart.addEventListener("click", restartGame);

      if (typeof emailConfig !== "undefined") {
        if (dom.emailBoxTitle && emailConfig.boxTitle) dom.emailBoxTitle.textContent = emailConfig.boxTitle;
        if (dom.emailBoxDesc && emailConfig.boxDesc) dom.emailBoxDesc.textContent = emailConfig.boxDesc;

        if (dom.inputHisNote && emailConfig.notePlaceholder) dom.inputHisNote.placeholder = emailConfig.notePlaceholder;
        if (dom.btnSendEmail && emailConfig.sendButtonText) dom.btnSendEmail.textContent = emailConfig.sendButtonText;
      }

      if (dom.btnSendEmail) {
        dom.btnSendEmail.addEventListener("click", handleSendEmail);
      }

      initSwipeGestures();
    }

    function switchScreen(screenKey) {
      Object.values(dom.screens).forEach((el) => el.classList.remove("active"));
      if (dom.screens[screenKey]) {
        dom.screens[screenKey].classList.add("active");
      }
    }

    function handleStartGame() {
      if (!Array.isArray(gifts) || gifts.length === 0) {
        showEmptyGiftsState();
        return;
      }

      currentGiftIndex = 0;
      likedGifts = [];
      skippedGifts = [];
      history = [];
      finalCandidates = [];
      tournamentWinner = null;

      dom.progressTrack.style.opacity = "1";
      switchScreen("swipe");
      renderCurrentGiftCard();
    }

    /* ==========================================================================
       6. Render Gift Card
       ========================================================================== */
    function renderCurrentGiftCard() {
      if (currentGiftIndex >= gifts.length) {
        finishSwipingPhase();
        return;
      }

      const gift = gifts[currentGiftIndex];
      const profile = gift.profile || {};
      const tags = profile.tags || gift.tags || [];

      dom.headerStatusPill.textContent = `候選對象 ${currentGiftIndex + 1}`;
      const progressPct = ((currentGiftIndex) / gifts.length) * 100;
      dom.progressFill.style.width = `${progressPct}%`;

      resetCardTransform(false);
      dom.activeCard.scrollTop = 0;

      setSafeImage(dom.cardPhoto, gift);
      dom.cardNameAge.textContent = gift.name;
      dom.cardJob.textContent = profile.job || "生日禮物候選人";
      dom.cardBio.textContent = profile.bio ? `「${profile.bio}」` : "「希望能成為你今年最喜歡的生日禮物。」";
      dom.cardDesc.textContent = gift.description || "";

      dom.cardTags.innerHTML = tags
        .map((tag) => `<span class="tag-chip"><span>#</span>${tag}</span>`)
        .join("");

      const extraBlocks = Array.isArray(gift.extraBlocks)
        ? gift.extraBlocks.filter((b) => b && ((b.image && b.image.trim()) || (b.text && b.text.trim())))
        : [];

      if (dom.cardExtraSection && dom.cardExtraList) {
        dom.cardExtraList.innerHTML = "";
        if (extraBlocks.length > 0) {
          dom.cardExtraSection.style.display = "flex";
          if (dom.scrollMorePill) dom.scrollMorePill.style.display = "inline-flex";
          extraBlocks.forEach((block) => {
            const itemEl = document.createElement("div");
            itemEl.className = "card-extra-item";

            if (block.image && block.image.trim()) {
              const imgEl = document.createElement("img");
              imgEl.className = "card-extra-img";
              imgEl.src = block.image.trim();
              imgEl.alt = gift.name || "禮物補充圖片";
              imgEl.onerror = function () {
                this.style.display = "none";
              };
              itemEl.appendChild(imgEl);
            }

            if (block.text && block.text.trim()) {
              const textEl = document.createElement("div");
              textEl.className = "card-extra-text";
              textEl.textContent = block.text.trim();
              itemEl.appendChild(textEl);
            }

            dom.cardExtraList.appendChild(itemEl);
          });
        } else {
          dom.cardExtraSection.style.display = "none";
          if (dom.scrollMorePill) dom.scrollMorePill.style.display = "none";
        }
      }

      renderNextCardPreview();
      dom.btnUndo.disabled = history.length === 0;
    }

    window.jumpToGiftCard = function (index, scrollTop = 0) {
      if (!Array.isArray(gifts) || gifts.length === 0) return;
      const safeIdx = Math.max(0, Math.min(index, gifts.length - 1));
      currentGiftIndex = safeIdx;
      dom.progressTrack.style.opacity = "1";
      switchScreen("swipe");
      renderCurrentGiftCard();
      if (scrollTop > 0 && dom.activeCard) {
        dom.activeCard.scrollTop = scrollTop;
      }
    };

    function renderNextCardPreview() {
      const nextGift = gifts[currentGiftIndex + 1];
      if (!nextGift) {
        dom.nextCardPreview.style.display = "none";
        return;
      }
      dom.nextCardPreview.style.display = "flex";
      const fallbackUri = createFallbackSvgDataUri(nextGift);
      dom.nextCardPreview.innerHTML = `
        <div class="card-photo-wrap">
          <img class="card-photo" src="${nextGift.image || fallbackUri}" alt="${nextGift.name}" onerror="this.onerror=null;this.src='${fallbackUri}';" />
        </div>
        <div class="card-body">
          <div class="profile-header">
            <h3 class="profile-name-age">${nextGift.name}</h3>
          </div>
        </div>
      `;
    }

    function resetCardTransform(withTransition = true) {
      if (withTransition) {
        dom.activeCard.classList.add("animating");
      } else {
        dom.activeCard.classList.remove("animating");
      }
      dom.activeCard.style.transform = "translate3d(0px, 0px, 0px) rotate(0deg)";
      dom.activeCard.style.opacity = "1";
      dom.badgeLike.style.opacity = "0";
      dom.badgeNope.style.opacity = "0";
      dom.nextCardPreview.style.transform = "scale(0.94) translateY(12px)";
    }

    /* ==========================================================================
       7. Swipe Handling
       ========================================================================== */
    function initSwipeGestures() {
      const card = dom.activeCard;

      card.addEventListener("touchstart", onPointerStart, { passive: true });
      card.addEventListener("touchmove", onPointerMove, { passive: true });
      card.addEventListener("touchend", onPointerEnd);
      card.addEventListener("touchcancel", onPointerEnd);

      card.addEventListener("mousedown", onPointerStart);
      window.addEventListener("mousemove", onPointerMove);
      window.addEventListener("mouseup", onPointerEnd);
    }

    function getClientPoint(e) {
      if (e.touches && e.touches.length > 0) {
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
      if (e.changedTouches && e.changedTouches.length > 0) {
        return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      }
      return { x: e.clientX, y: e.clientY };
    }

    function onPointerStart(e) {
      if (swipeState.isLocked || !dom.screens.swipe.classList.contains("active")) return;
      if (e.type === "mousedown" && e.button !== 0) return;

      const pt = getClientPoint(e);
      swipeState.isDragging = true;
      swipeState.gestureAxis = null;
      swipeState.startX = pt.x;
      swipeState.startY = pt.y;
      swipeState.currentX = 0;
      swipeState.currentY = 0;
      dom.activeCard.classList.remove("animating");
    }

    function onPointerMove(e) {
      if (!swipeState.isDragging || swipeState.isLocked) return;

      const pt = getClientPoint(e);
      const deltaX = pt.x - swipeState.startX;
      const deltaY = pt.y - swipeState.startY;

      if (!swipeState.gestureAxis) {
        if (Math.abs(deltaX) < 8 && Math.abs(deltaY) < 8) return;
        if (e.touches && Math.abs(deltaY) > Math.abs(deltaX)) {
          swipeState.gestureAxis = "y";
          return;
        }
        swipeState.gestureAxis = "x";
      }

      if (swipeState.gestureAxis === "y") return;

      swipeState.currentX = deltaX;
      swipeState.currentY = deltaY;

      const rotateDeg = deltaX * 0.055;
      dom.activeCard.style.transform = `translate3d(${deltaX}px, ${deltaY * 0.25}px, 0px) rotate(${rotateDeg}deg)`;

      const progress = Math.min(Math.abs(deltaX) / SWIPE_THRESHOLD, 1);
      if (deltaX > 15) {
        dom.badgeLike.style.opacity = String(progress);
        dom.badgeNope.style.opacity = "0";
      } else if (deltaX < -15) {
        dom.badgeNope.style.opacity = String(progress);
        dom.badgeLike.style.opacity = "0";
      } else {
        dom.badgeLike.style.opacity = "0";
        dom.badgeNope.style.opacity = "0";
      }

      const nextScale = 0.94 + progress * 0.06;
      const nextY = 12 - progress * 12;
      dom.nextCardPreview.style.transform = `scale(${nextScale}) translateY(${nextY}px)`;
    }

    function onPointerEnd() {
      if (!swipeState.isDragging) return;
      swipeState.isDragging = false;

      if (swipeState.isLocked) return;
      if (swipeState.gestureAxis === "y") {
        swipeState.gestureAxis = null;
        return;
      }
      swipeState.gestureAxis = null;

      const deltaX = swipeState.currentX;
      if (deltaX >= SWIPE_THRESHOLD) {
        triggerDecision("like");
      } else if (deltaX <= -SWIPE_THRESHOLD) {
        triggerDecision("skip");
      } else {
        resetCardTransform(true);
      }
    }

    /* ==========================================================================
       8. Like / Skip
       ========================================================================== */
    function triggerDecision(action) {
      if (swipeState.isLocked || currentGiftIndex >= gifts.length) return;
      swipeState.isLocked = true;

      const gift = gifts[currentGiftIndex];
      const isLike = action === "like";

      dom.activeCard.classList.add("animating");
      if (isLike) {
        dom.badgeLike.style.opacity = "1";
        dom.badgeNope.style.opacity = "0";
        dom.activeCard.style.transform = "translate3d(420px, -20px, 0px) rotate(18deg)";
      } else {
        dom.badgeNope.style.opacity = "1";
        dom.badgeLike.style.opacity = "0";
        dom.activeCard.style.transform = "translate3d(-420px, -20px, 0px) rotate(-18deg)";
      }
      dom.activeCard.style.opacity = "0";
      dom.nextCardPreview.style.transform = "scale(1) translateY(0px)";

      history.push({
        giftIndex: currentGiftIndex,
        gift: gift,
        action: action
      });

      if (isLike) {
        likedGifts.push(gift);
      } else {
        skippedGifts.push(gift);
      }

      setTimeout(() => {
        currentGiftIndex++;
        if (isLike) {
          showMatchAnimation(gift, () => {
            swipeState.isLocked = false;
            renderCurrentGiftCard();
          });
        } else {
          swipeState.isLocked = false;
          renderCurrentGiftCard();
        }
      }, 280);
    }

    /* ==========================================================================
       9. Undo
       ========================================================================== */
    function handleUndo() {
      if (swipeState.isLocked || history.length === 0) return;

      const lastRecord = history.pop();
      currentGiftIndex = lastRecord.giftIndex;

      if (lastRecord.action === "like") {
        likedGifts.pop();
      } else {
        skippedGifts.pop();
      }

      renderCurrentGiftCard();

      const startOffset = lastRecord.action === "like" ? 180 : -180;
      dom.activeCard.classList.remove("animating");
      dom.activeCard.style.transform = `translate3d(${startOffset}px, 0px, 0px) rotate(${startOffset * 0.04}deg)`;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          resetCardTransform(true);
        });
      });
    }

    /* ==========================================================================
       10. Match Animation
       ========================================================================== */
    let activeMatchCallback = null;

    function showMatchAnimation(gift, onComplete) {
      setSafeImage(dom.matchPhoto, gift);
      dom.matchGiftName.textContent = `「${gift.name}」`;
      dom.matchOverlay.classList.add("active");
      activeMatchCallback = onComplete;

      clearTimeout(swipeState.matchTimer);
      swipeState.matchTimer = setTimeout(() => {
        closeMatchOverlay();
      }, 1350);
    }

    function dismissMatchOverlayEarly() {
      if (!dom.matchOverlay.classList.contains("active")) return;
      clearTimeout(swipeState.matchTimer);
      closeMatchOverlay();
    }

    function closeMatchOverlay() {
      dom.matchOverlay.classList.remove("active");
      if (typeof activeMatchCallback === "function") {
        const cb = activeMatchCallback;
        activeMatchCallback = null;
        cb();
      }
    }

    /* ==========================================================================
       11. Tournament
       ========================================================================== */
    function showEmptyGiftsState() {
      dom.progressTrack.style.opacity = "0";
      dom.headerStatusPill.textContent = "尚無候選禮物";
      dom.summaryCount.textContent = "0";
      dom.summaryTitle.textContent = texts.summaryEmptyTitle;
      dom.summaryLines.innerHTML = `
        <p>目前還沒有候選禮物。</p>
        <p>請先在 <code>gifts</code> 陣列新增至少一個禮物。</p>
      `;
      dom.summaryLikedList.innerHTML = "";
      dom.btnEnterTournament.style.display = "none";
      switchScreen("summary");
    }

    function finishSwipingPhase() {
      dom.progressFill.style.width = "100%";
      dom.headerStatusPill.textContent = "配對統計";
      dom.btnEnterTournament.style.display = "inline-flex";

      if (gifts.length === 1) {
        finalCandidates = [gifts[0]];
        tournamentWinner = gifts[0];
        tournamentState.lastMatchup = null;
        showFinalConfirmation(tournamentWinner);
        return;
      }

      const likeCount = likedGifts.length;
      dom.summaryCount.textContent = String(likeCount);

      if (likeCount > 0) {
        dom.summaryLikedList.innerHTML = likedGifts
          .map((g) => `<span class="liked-mini-pill">💛 ${g.name}</span>`)
          .join("");
      } else {
        dom.summaryLikedList.innerHTML = "";
      }

      if (likeCount >= 2) {
        finalCandidates = [...likedGifts];
        dom.summaryTitle.textContent = texts.summaryNormalTitle;
        dom.summaryLines.innerHTML = `
          <p>你總共喜歡了 <strong>${likeCount}</strong> 個。</p>
          <p>但生日禮物只能帶一個回家。</p>
          <p>所以...</p>
          <p>現在開始最終淘汰賽。</p>
        `;
        dom.btnEnterTournamentText.textContent = texts.enterFinalButton;
      } else if (likeCount === 1) {
        const likedOne = likedGifts[0];
        const pool = skippedGifts.length > 0
          ? skippedGifts
          : gifts.filter((g) => g.id !== likedOne.id);
        const randomChallenger = pool[Math.floor(Math.random() * pool.length)];
        finalCandidates = randomChallenger ? [likedOne, randomChallenger] : [likedOne];

        dom.summaryTitle.textContent = texts.summaryOneLikeTitle;
        dom.summaryLines.innerHTML = `
          <p>這樣太簡單了。</p>
          <p>我幫你找一個對手。</p>
          <p>讓「<strong>${likedOne.name}</strong>」跟神秘挑戰者 PK 一場！</p>
        `;
        dom.btnEnterTournamentText.textContent = texts.enterFinalButton;
      } else {
        const shuffled = [...gifts].sort(() => Math.random() - 0.5);
        finalCandidates = shuffled.slice(0, Math.min(2, shuffled.length));

        dom.summaryTitle.textContent = texts.summaryZeroLikeTitle;
        dom.summaryLines.innerHTML = `
          <p>好。</p>
          <p>那我只好幫你安排相親了。</p>
          <p>從候選名單中精選 2 位直接進行最終對決！</p>
        `;
        dom.btnEnterTournamentText.textContent = "開始相親對決";
      }

      switchScreen("summary");
    }

    function startTournamentPhase() {
      if (finalCandidates.length === 0) return;
      if (finalCandidates.length === 1) {
        tournamentWinner = finalCandidates[0];
        tournamentState.lastMatchup = null;
        showFinalConfirmation(tournamentWinner);
        return;
      }

      tournamentState.currentChampion = finalCandidates[0];
      tournamentState.challengerQueue = finalCandidates.slice(1);
      tournamentState.totalRounds = tournamentState.challengerQueue.length;
      tournamentState.roundNumber = 1;
      tournamentState.currentChallenger = tournamentState.challengerQueue.shift();

      switchScreen("tournament");
      renderTournamentMatchup();
    }

    function renderTournamentMatchup() {
      const fighterA = tournamentState.currentChampion;
      const fighterB = tournamentState.currentChallenger;

      const total = tournamentState.totalRounds;
      const current = tournamentState.roundNumber;

      dom.headerStatusPill.textContent = `決賽 PK (${current}/${total})`;
      dom.progressTrack.style.opacity = "1";
      dom.progressFill.style.width = `${((current - 1) / total) * 100}%`;

      dom.tournamentRoundBadge.textContent = total > 1
        ? `${texts.finalTitle} · 第 ${current} / ${total} 戰`
        : texts.finalTitle;

      populateFighterCard("A", fighterA);
      populateFighterCard("B", fighterB);
    }

    function populateFighterCard(slot, gift) {
      const profile = gift.profile || {};
      const tags = (profile.tags || gift.tags || []).slice(0, 3);
      const isA = slot === "A";

      setSafeImage(isA ? dom.fighterImgA : dom.fighterImgB, gift);
      (isA ? dom.fighterNameA : dom.fighterNameB).textContent = gift.name;
      (isA ? dom.fighterJobA : dom.fighterJobB).textContent =
        profile.job || "候選禮物";
      (isA ? dom.fighterBioA : dom.fighterBioB).textContent =
        `「${profile.bio || gift.description || ""}」`;
      (isA ? dom.fighterTagsA : dom.fighterTagsB).innerHTML = tags
        .map((t) => `<span class="vs-tag">#${t}</span>`)
        .join("");
      (isA ? dom.btnPickA : dom.btnPickB).textContent = `選 ${gift.name}`;
    }

    function handleTournamentPick(choice) {
      const fighterA = tournamentState.currentChampion;
      const fighterB = tournamentState.currentChallenger;
      const winner = choice === "A" ? fighterA : fighterB;

      tournamentState.lastMatchup = {
        fighterA: fighterA,
        fighterB: fighterB,
        roundNumber: tournamentState.roundNumber,
        totalRounds: tournamentState.totalRounds
      };

      tournamentState.currentChampion = winner;

      if (tournamentState.challengerQueue.length > 0) {
        tournamentState.currentChallenger = tournamentState.challengerQueue.shift();
        tournamentState.roundNumber++;
        renderTournamentMatchup();
      } else {
        dom.progressFill.style.width = "100%";
        tournamentWinner = winner;
        showFinalConfirmation(tournamentWinner);
      }
    }

    /* ==========================================================================
       12. Final Confirmation
       ========================================================================== */
    function showFinalConfirmation(winner) {
      if (!winner) return;
      const profile = winner.profile || {};

      dom.headerStatusPill.textContent = "最終確認";
      dom.progressTrack.style.opacity = "0";

      dom.confirmWinnerName.textContent = `「${winner.name}」`;
      setSafeImage(dom.confirmWinnerImg, winner);
      dom.confirmWinnerJob.textContent = profile.job || "壽星專屬";
      dom.confirmWinnerDesc.textContent = winner.description || profile.bio || "";

      switchScreen("confirm");
    }

    function handleConfirmRethink() {
      if (finalCandidates.length >= 2) {
        startTournamentPhase();
      } else {
        restartGame();
      }
    }

    /* ==========================================================================
       13. Birthday Celebration
       ========================================================================== */
    let confettiFrameId = null;

    function showBirthdayCelebration() {
      if (!tournamentWinner && Array.isArray(gifts) && gifts.length > 0) {
        tournamentWinner = gifts[0];
      }
      if (!tournamentWinner) return;

      dom.headerStatusPill.textContent = "Happy Birthday 🎂";
      dom.progressTrack.style.opacity = "0";

      dom.birthdayTitle.innerHTML = String(birthdayMessage.title || "")
        .split(/\r?\n|<br\s*\/?>/i)
        .map((line) => line.trim())
        .filter(Boolean)
        .join("<br>");
      dom.birthdayLines.innerHTML = birthdayMessage.lines
        .map((line) => `<p>${line}</p>`)
        .join("");

      setSafeImage(dom.finalGiftImg, tournamentWinner);
      dom.finalGiftName.textContent = tournamentWinner.name;
      dom.finalGiftDesc.textContent = tournamentWinner.description || (tournamentWinner.profile && tournamentWinner.profile.bio) || "";

      if (dom.emailSendStatus) {
        dom.emailSendStatus.className = "email-send-status";
        dom.emailSendStatus.innerHTML = "";
      }
      if (dom.btnSendEmail) {
        dom.btnSendEmail.disabled = false;
        dom.btnSendEmail.textContent = (typeof emailConfig !== "undefined" && emailConfig.sendButtonText)
          ? emailConfig.sendButtonText
          : "📨 寄出配對紀念信給我們";
      }

      switchScreen("birthday");
      startConfettiCelebration();
    }

    function escapeHtmlStr(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildEmailContent(winner, hisEmail, hisNote) {
      const cfg = typeof emailConfig !== "undefined" ? emailConfig : {};
      const profile = (winner && winner.profile) || {};
      const giftName = (winner && winner.name) || "神秘生日禮物";
      const giftJob = profile.job || "壽星專屬精選";
      const giftBio = profile.bio || "";
      const giftDesc = (winner && winner.description) || giftBio || "";
      const tags = Array.isArray(profile.tags) ? profile.tags : [];
      const nowStr = new Date().toLocaleString("zh-TW", { hour12: false });

      const subject = cfg.subject || `💛 [${texts.appBrand} 配對成功通知] 恭喜你與「${giftName}」配對成功！🎂`;
      const introLines = Array.isArray(cfg.introLines) && cfg.introLines.length > 0
        ? cfg.introLines
        : [
            "親愛的壽星：",
            "叮咚！恭喜你在今年的生日禮物約會決選中，與你的命定禮物配對成功！✨",
            "這封信已同時寄給壽星本人與你的專屬送禮人，作為今年生日禮物的正式兌換憑證 🎁"
          ];
      const footerLines = Array.isArray(cfg.footerLines) && cfg.footerLines.length > 0
        ? cfg.footerLines
        : [
            "生日快樂！！🥳",
            "請憑此信向你的專屬送禮人領取實體驚喜 ❤️"
          ];

      const plainLines = [
        ...introLines,
        "",
        "━━━━━━━━━━━━━━━━━━━━━━",
        "🏆 BIRTHDAY MATCH 命定禮物配對憑證",
        "━━━━━━━━━━━━━━━━━━━━━━",
        `🎁 獲選禮物：${giftName}`,
        `🏷️ 禮物頭銜：${giftJob}`,
        giftBio ? `💬 禮物自介：${giftBio}` : null,
        giftDesc ? `📝 禮物介紹：${giftDesc}` : null,

        "",

      ].filter((line) => line !== null);

      const plainText = plainLines.join("\n");

      const htmlBody = `
<div style="font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif;max-width:540px;margin:0 auto;background:#FAF8F4;border:2px solid #FFC629;border-radius:20px;overflow:hidden;color:#1A1A1A;">
  <div style="background:#FFC629;padding:18px 22px;text-align:center;">

    <h1 style="margin:6px 0 0;font-size:22px;font-weight:900;color:#1A1A1A;">IT'S A MATCH! 💛 命定禮物配對憑證</h1>
  </div>
  <div style="padding:22px;background:#FFFFFF;">
    ${introLines.map((l) => `<p style="margin:0 0 10px;font-size:14px;line-height:1.65;color:#333333;">${escapeHtmlStr(l)}</p>`).join("")}
    <div style="margin:18px 0;padding:16px;background:#FFF7DC;border:2px solid #FFC629;border-radius:16px;">
      <div style="font-size:11px;font-weight:800;color:#9A7000;letter-spacing:0.06em;margin-bottom:4px;">🏆 今年生日禮物最終得主</div>
      <div style="font-size:18px;font-weight:900;color:#1A1A1A;margin-bottom:6px;">🎁 ${escapeHtmlStr(giftName)}</div>
      <div style="font-size:13px;font-weight:700;color:#5C5C5C;margin-bottom:8px;">🏷️ ${escapeHtmlStr(giftJob)}</div>
      ${giftBio ? `<div style="font-size:13px;color:#333333;background:#FFFFFF;padding:8px 12px;border-radius:10px;margin-bottom:8px;border-left:3px solid #FFC629;">${escapeHtmlStr(giftBio)}</div>` : ""}
      ${giftDesc && giftDesc !== giftBio ? `<div style="font-size:12.5px;color:#555555;line-height:1.55;margin-bottom:8px;">${escapeHtmlStr(giftDesc)}</div>` : ""}
      ${tags.length > 0 ? `<div style="margin-top:8px;">${tags.map((t) => `<span style="display:inline-block;background:#1A1A1A;color:#FFC629;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin:2px 4px 2px 0;">#${escapeHtmlStr(t)}</span>`).join("")}</div>` : ""}
      <hr style="border:none;border-top:1px dashed #E5C158;margin:12px 0;" />
      <div style="font-size:12px;color:#5C5C5C;line-height:1.6;">
        <div><strong>🕒 配對時間：</strong>${escapeHtmlStr(nowStr)}</div>
        <div><strong>📧 壽星信箱：</strong>${escapeHtmlStr(hisEmail || "尚未填寫")}</div>
        ${cfg.ownerEmail ? `<div><strong>💝 送禮人信箱：</strong>${escapeHtmlStr(cfg.ownerEmail)}</div>` : ""}
        ${hisNote ? `<div style="margin-top:6px;padding:8px 10px;background:#FFFDF7;border-radius:8px;border:1px solid #F0D98C;color:#1A1A1A;"><strong>💌 壽星給送禮人的悄悄話：</strong><br/>「${escapeHtmlStr(hisNote)}」</div>` : ""}
      </div>
    </div>
    ${footerLines.map((l) => `<p style="margin:0 0 8px;font-size:14px;line-height:1.65;color:#333333;font-weight:600;">${escapeHtmlStr(l)}</p>`).join("")}
  </div>
</div>`.trim();

      return {
        subject,
        plainText,

        giftName,

        giftDesc,

    async function handleSendEmail() {
      if (!tournamentWinner && Array.isArray(gifts) && gifts.length > 0) {
        tournamentWinner = gifts[0];
      }
      if (!tournamentWinner) return;

      const hisEmail = dom.inputHisEmail ? dom.inputHisEmail.value.trim() : "";
      const hisNote = dom.inputHisNote ? dom.inputHisNote.value.trim() : "";
      const cfg = typeof emailConfig !== "undefined" ? emailConfig : {};
      const ownerEmail = (cfg.ownerEmail || "").trim();
      const gasWebhookUrl = (cfg.gasWebhookUrl || "").trim();

      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!hisEmail || !emailRegex.test(hisEmail)) {
        if (dom.inputHisEmail) {
          dom.inputHisEmail.style.borderColor = "#D92D20";
          dom.inputHisEmail.style.boxShadow = "0 0 0 3px rgba(217, 45, 32, 0.2)";
          dom.inputHisEmail.focus();
          setTimeout(() => {
            dom.inputHisEmail.style.borderColor = "";
            dom.inputHisEmail.style.boxShadow = "";
          }, 2200);
        }
        dom.emailSendStatus.className = "email-send-status error";
        dom.emailSendStatus.innerHTML = "⚠️ <strong>請先在上方輸入有效的 Email 信箱</strong>（例如：<code>example@gmail.com</code>），才能把配對憑證寄給你們喔！";
        if (dom.emailSendStatus.scrollIntoView) {
          dom.emailSendStatus.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
        return;
      }

      const mail = buildEmailContent(tournamentWinner, hisEmail, hisNote);

      const toRecipients = [hisEmail, ownerEmail].filter(Boolean).join(",");
      // 為 mailto: 製作精簡版內文（避免超過 Windows 2048 字元上限導致點擊無反應）
      const shortMailtoBody = [
        (cfg.introLines && cfg.introLines[0]) || "親愛的壽星：",
        "恭喜你在今年的生日禮物約會決選中，與命定禮物配對成功！✨",
        "",
        `🏆 獲選禮物：${mail.giftName}`,
        `🏷️ 禮物頭銜：${mail.giftJob}`,
        hisNote ? `💌 壽星悄悄話：「${hisNote}」` : null,
        `🕒 配對時間：${mail.nowStr}`,
        "",
        (cfg.footerLines && cfg.footerLines[0]) || "生日快樂！！🥳 請憑此信向送禮人領取實體驚喜 ❤️"
      ].filter(Boolean).join("\n");

      const mailtoHref = `mailto:${encodeURIComponent(toRecipients)}?subject=${encodeURIComponent(mail.subject)}&body=${encodeURIComponent(shortMailtoBody)}`;
      const gmailComposeUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(toRecipients)}&su=${encodeURIComponent(mail.subject)}&body=${encodeURIComponent(mail.plainText)}`;

      dom.btnSendEmail.disabled = true;
      dom.btnSendEmail.textContent = "⏳ 正在寄出配對紀念信...";
      dom.emailSendStatus.className = "email-send-status info";
      dom.emailSendStatus.textContent = "正在傳送你的命定禮物配對通知書...";
      if (dom.emailSendStatus.scrollIntoView) {
        dom.emailSendStatus.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      await new Promise((r) => setTimeout(r, 400));

      try {
        // 模式 1：若已在編輯器設定 Google Apps Script 網址，直接雙向寄送精美 HTML 信件給壽星與送禮人
        if (gasWebhookUrl && /^https:\/\/script\.google\.com\//i.test(gasWebhookUrl)) {
          await fetch(gasWebhookUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              hisEmail,
              ownerEmail,
              hisNote,
              subject: mail.subject,
              plainText: mail.plainText,
              htmlBody: mail.htmlBody,
              giftName: mail.giftName,
              giftJob: mail.giftJob,
              matchedAt: mail.nowStr
            })
          });

          dom.btnSendEmail.textContent = "✅ 已寄出配對紀念信！";
          dom.emailSendStatus.className = "email-send-status success";
          dom.emailSendStatus.innerHTML = `
            🎉 <strong>配對紀念信已成功寄出！</strong><br/>
            已同時寄送至 <strong>${escapeHtmlStr(hisEmail)}</strong>${ownerEmail ? ` 與送禮人信箱 (<strong>${escapeHtmlStr(ownerEmail)}</strong>)` : ""}，快去信箱收信吧！
          `;
          return;
        }

        // 模式 2：當網站部署於正式網址 (http/https) 時，透過 FormSubmit 自動寄送給雙方
        const primaryTarget = (ownerEmail && emailRegex.test(ownerEmail)) ? ownerEmail : hisEmail;
        const ccTarget = (ownerEmail && emailRegex.test(ownerEmail) && ownerEmail !== hisEmail) ? hisEmail : "";
        if (window.location && /^https?:$/i.test(window.location.protocol)) {
          const response = await fetch(`https://formsubmit.co/ajax/${encodeURIComponent(primaryTarget)}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({
              _subject: mail.subject,
              ...(ccTarget ? { _cc: ccTarget } : {}),
              _replyto: hisEmail,
              _template: "box",
              "🏆 獲選生日禮物": mail.giftName,
              "🏷️ 禮物頭銜": mail.giftJob,
              "📝 禮物介紹": mail.giftDesc,
              "📧 壽星信箱": hisEmail,
              "💌 壽星悄悄話": hisNote || "（無）",
              "🕒 配對時間": mail.nowStr,
              "📜 紀念信完整內容": mail.plainText
            })
          });
          const resData = await response.json().catch(() => ({}));
          if (response.ok && (resData.success === "true" || resData.success === true)) {
            dom.btnSendEmail.textContent = "✅ 已寄出配對紀念信！";
            dom.emailSendStatus.className = "email-send-status success";
            dom.emailSendStatus.innerHTML = `
              🎉 <strong>配對紀念信已成功寄出！</strong><br/>
              系統已將通知信寄至 <strong>${escapeHtmlStr(primaryTarget)}</strong>${ccTarget ? ` 並同時副本寄給 <strong>${escapeHtmlStr(ccTarget)}</strong>` : ""}！
            `;
            return;
          }
        }

        // 模式 3：備援模式
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(`${mail.subject}\n\n${mail.plainText}`).catch(() => {});
        }
        dom.btnSendEmail.disabled = false;
        dom.btnSendEmail.textContent = "✅ 已產生配對紀念信！（請點下方寄出）";

        dom.emailSendStatus.className = "email-send-status success";
        dom.emailSendStatus.innerHTML = `
          💌 <strong>已為你產生專屬配對紀念信（並已自動複製全文）！</strong><br/>
          收件人：<strong>${escapeHtmlStr(toRecipients)}</strong><br/>
          請選擇以下任一方式立即寄出給你們兩個人：
          <div class="email-fallback-links">
            <a class="email-fallback-btn" href="${gmailComposeUrl}" target="_blank" rel="noopener noreferrer">📮 用 Gmail 網頁版一鍵寄出</a>
            <a class="email-fallback-btn" href="${mailtoHref}" target="_top">📱 開啟手機/電腦郵件 App 寄出</a>
            <button type="button" class="email-fallback-btn" id="btn-copy-email-text">📋 再次複製整封紀念信</button>
          </div>
        `;
        const copyBtn = document.getElementById("btn-copy-email-text");
        if (copyBtn) {
          copyBtn.addEventListener("click", () => {
            navigator.clipboard.writeText(`${mail.subject}\n\n${mail.plainText}`).then(() => {
              copyBtn.textContent = "✅ 已複製信件內容！";
            });
          });
        }
        if (dom.emailSendStatus.scrollIntoView) {
          dom.emailSendStatus.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      } catch (err) {
        dom.btnSendEmail.disabled = false;
        dom.btnSendEmail.textContent = "✅ 已產生配對紀念信！（請點下方寄出）";
        dom.emailSendStatus.className = "email-send-status info";
        dom.emailSendStatus.innerHTML = `
          💌 <strong>已準備好你的專屬配對紀念信！</strong><br/>
          請點擊下方按鈕一鍵寄給壽星與送禮人：
          <div class="email-fallback-links">
            <a class="email-fallback-btn" href="${gmailComposeUrl}" target="_blank" rel="noopener noreferrer">📮 用 Gmail 網頁版一鍵寄出</a>
            <a class="email-fallback-btn" href="${mailtoHref}" target="_top">📱 開啟手機/電腦郵件 App 寄出</a>
          </div>
        `;
      }
    }

    function startConfettiCelebration() {
      stopConfettiCelebration();
      const canvas = dom.confettiCanvas;
      const ctx = canvas.getContext("2d");
      const shell = document.getElementById("app-shell");

      canvas.width = shell.clientWidth;
      canvas.height = shell.clientHeight;

      const colors = ["#FFC629", "#1A1A1A", "#FFE07D", "#FF9F1C", "#FFFFFF"];
      const particles = Array.from({ length: 65 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * -canvas.height,
        w: 7 + Math.random() * 7,
        h: 6 + Math.random() * 8,
        color: colors[Math.floor(Math.random() * colors.length)],
        vy: 1.8 + Math.random() * 2.8,
        vx: (Math.random() - 0.5) * 1.8,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.14
      }));

      function renderFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.angle += p.spin;
          if (p.y > canvas.height + 20) {
            p.y = -15;
            p.x = Math.random() * canvas.width;
          }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });
        confettiFrameId = requestAnimationFrame(renderFrame);
      }

      renderFrame();
    }

    function stopConfettiCelebration() {
      if (confettiFrameId) {
        cancelAnimationFrame(confettiFrameId);
        confettiFrameId = null;
      }
      const canvas = dom.confettiCanvas;
      if (canvas) {
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    /* ==========================================================================
       14. Restart
       ========================================================================== */
    function restartGame() {
      stopConfettiCelebration();
      clearTimeout(swipeState.matchTimer);
      dom.matchOverlay.classList.remove("active");

      currentGiftIndex = 0;
      likedGifts = [];
      skippedGifts = [];
      history = [];
      finalCandidates = [];
      tournamentWinner = null;

      tournamentState = {
        currentChampion: null,
        challengerQueue: [],
        currentChallenger: null,
        roundNumber: 1,
        totalRounds: 1,
        lastMatchup: null
      };

      swipeState.isLocked = false;
      swipeState.isDragging = false;

      dom.headerStatusPill.textContent = "id : wu_chian";
      dom.progressTrack.style.opacity = "0";
      dom.progressFill.style.width = "0%";

      switchScreen("welcome");
    }

    initApp();
  </script>
